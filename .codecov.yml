# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml
#
# The `test` target in the Makefile produces `cover.out`, but no step currently
# uploads it: CI runs the shared Tekton build pipeline, which has no Codecov
# upload task. Until that is wired, these status checks stay `informational` and
# `if_not_found: success` so a missing report never fails a pull request.
# Remove `informational: true` once uploads are confirmed.

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_not_found: success
        informational: true
    patch:
      default:
        target: auto
        threshold: 5%
        if_not_found: success
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "**/*_test.go"
  - "test/**"
  - "vendor/**"
  - "**/zz_generated.*"
