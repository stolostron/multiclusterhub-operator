# This is a basic workflow to help you get started with Actions

name: Regenerate Operator Bundles

# Controls when the action will run.
on:
  # Runs every six hours
  schedule:
    - cron: "0 */6 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch_arg:
        description: 'Target branch to regenerate (e.g. release-2.17). Leave empty to regenerate all branches.'
        required: false
        default: ''
        type: string
      org_arg:
        description: 'ORG argument for the make command'
        required: false
        default: 'stolostron'
        type: string
      component_arg:
        description: 'COMPONENT to regenerate (e.g. submariner-addon). Leave empty for all.'
        required: false
        default: ''
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: write
  pull-requests: write

jobs:
  # Resolve the branch matrix. Scheduled runs cover every branch; a manual
  # dispatch may target a single branch by setting branch_arg.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.matrix.outputs.branches }}
    steps:
      - name: Resolve branch matrix
        id: matrix
        env:
          REQUESTED: ${{ github.event.inputs.branch_arg }}
          ALL_BRANCHES: '["main","release-2.11","release-2.13","release-2.14","release-2.15","release-2.16","release-2.17","release-5.0"]'
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "branches=$ALL_BRANCHES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$ALL_BRANCHES" | grep -q "\"$REQUESTED\""; then
            echo "::error::Unknown branch '$REQUESTED'. Valid branches: $ALL_BRANCHES"
            exit 1
          fi
          echo "branches=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"

  # This workflow contains a single job called "build"
  build:
    needs: prepare
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    concurrency:
      group: regenerate-bundles-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false # If one jobs fail, we still want the other jobs to run.
      matrix:
        python-version: [3.13]
        go-version: ["1.26"]
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ matrix.branch }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }} # Specify the Go version from the matrix

      # Install yq dependency for template variable sync
      - name: Install yq for template variable sync
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Regenerate charts from bundles AND sync template variables
      # The sync step will run regenerate-charts-from-bundles, detect any new variables,
      # add them to config.yaml, then re-run regeneration to apply proper escaping
      - name: Regenerate Operator Charts From Bundles with Variable Sync
        env:
          ORG: ${{ github.event.inputs.org_arg || 'stolostron' }}
          COMPONENT: ${{ github.event.inputs.component_arg || '' }}
        run: |
          # First regenerate to pull latest upstream changes
          make regenerate-charts-from-bundles COMPONENT="${COMPONENT}"

          # Then sync variables (will re-run regeneration if new variables found)
          make -f Makefile.dev sync-template-vars

          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Regenerate step failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Generate code
        run: |
          echo "Running go generate..."
          go generate
  
      - name: Generate Manifests
        run: |
          echo "Generating manifests..."
          make manifests

      - name: Send Slack Message on Failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SLACK_MESSAGE=":exclamation: *GitHub Actions Job Failed* :exclamation:\n\n"
          SLACK_MESSAGE+="Job Name: $GITHUB_WORKFLOW/$GITHUB_JOB\n"
          SLACK_MESSAGE+="Job URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n"
          SLACK_MESSAGE+="Error Details: Your job failed. Please check the job logs for more information."

          curl -X POST -H "Content-type: application/json" --data "{
            \"text\": \"$SLACK_MESSAGE\"
          }" $SLACK_WEBHOOK_URL

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          signoff: true
          branch: "regenerate-operator-bundles-${{ matrix.branch }}"
          delete-branch: true
          title: "Operator Bundle Update [${{ matrix.branch }}]"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          labels: |
            do-not-merge/hold
            ok-to-test
          reviewers: cameronmwall,dislbenn,ngraham20
