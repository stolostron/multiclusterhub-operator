# This is a basic workflow to help you get started with Actions

name: Regenerate Operator Bundles

# Controls when the action will run.
on:
  # Runs every six hours
  schedule:
    - cron: "0 */6 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch_arg:
        description: 'BRANCH agrument for the make command'
        required: false
        default: 'main'
        type: string
      org_arg:
        description: 'ORG argument for the make command'
        required: false
        default: 'stolostron'
        type: string
      component_arg:
        description: 'COMPONENT to regenerate (e.g. submariner-addon). Leave empty for all.'
        required: false
        default: ''
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If one jobs fail, we still want the other jobs to run.
      matrix:
        python-version: [3.13]
        go-version: ["1.26"]
        branch: ['main', 'release-2.11', 'release-2.13', 'release-2.14', 'release-2.15', 'release-2.16', 'release-2.17']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ matrix.branch }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }} # Specify the Go version from the matrix

      # Install yq dependency for template variable sync
      - name: Install yq for template variable sync
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Regenerate charts from bundles AND sync template variables
      # The sync step will run regenerate-charts-from-bundles, detect any new variables,
      # add them to config.yaml, then re-run regeneration to apply proper escaping
      - name: Regenerate Operator Charts From Bundles with Variable Sync
        id: regenerate
        env:
          BRANCH: ${{ github.event.inputs.branch_arg || 'main' }}
          ORG: ${{ github.event.inputs.org_arg || 'stolostron' }}
          COMPONENT: ${{ github.event.inputs.component_arg || '' }}
        run: |
          set -o pipefail

          # First regenerate to pull latest upstream changes
          # Then sync variables (will re-run regeneration if new variables found)
          {
            make regenerate-charts-from-bundles COMPONENT="${COMPONENT}"
            make -f Makefile.dev sync-template-vars
          } 2>&1 | tee /tmp/regenerate.log

      - name: Generate code
        run: |
          echo "Running go generate..."
          go generate
  
      - name: Generate Manifests
        run: |
          echo "Generating manifests..."
          make manifests

      - name: Render Pull Request body
        run: |
          {
            echo "- **Workflow run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **Event:** ${GITHUB_EVENT_NAME}"
            echo "- **Branch:** ${{ matrix.branch }}"
          } > /tmp/trigger.txt

          {
            echo '```'
            git diff --stat || echo "No changes detected"
            echo '```'
          } > /tmp/diffstat.txt

          # Only surface the specific "a manifest could not be parsed and was
          # skipped" condition here, not every routine WARNING the tooling
          # logs on a normal run (there are dozens of those and they aren't
          # actionable).
          if grep -q "UNPARSEABLE_MANIFEST" /tmp/regenerate.log; then
            {
              echo '```'
              grep "UNPARSEABLE_MANIFEST" /tmp/regenerate.log
              echo '```'
            } > /tmp/warnings.txt
          else
            : > /tmp/warnings.txt
          fi

          python3 hack/scripts/render_pr_body.py \
            --template .github/PULL_REQUEST_TEMPLATE/automated-bundle-update.md \
            --output /tmp/pr-body.md \
            --set-file TRIGGER=/tmp/trigger.txt \
            --set-file DIFFSTAT=/tmp/diffstat.txt \
            --set-file WARNINGS=/tmp/warnings.txt

      - name: Send Slack Message on Failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SLACK_MESSAGE=":exclamation: *GitHub Actions Job Failed* :exclamation:\n\n"
          SLACK_MESSAGE+="Job Name: $GITHUB_WORKFLOW/$GITHUB_JOB\n"
          SLACK_MESSAGE+="Job URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n"
          SLACK_MESSAGE+="Error Details: Your job failed. Please check the job logs for more information."

          curl -X POST -H "Content-type: application/json" --data "{
            \"text\": \"$SLACK_MESSAGE\"
          }" $SLACK_WEBHOOK_URL

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          signoff: true
          branch: "regenerate-operator-bundles-${{ matrix.branch }}"
          delete-branch: true
          title: "Operator Bundle Update [${{ matrix.branch }}]"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body-path: /tmp/pr-body.md
          labels: |
            do-not-merge/hold
            ok-to-test
          reviewers: cameronmwall,dislbenn,ngraham20
