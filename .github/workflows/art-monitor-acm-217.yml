name: ART FBC Monitor - ACM 2.17

on:
  schedule:
    # Schedule matches corresponding bundle repo workflow
    - cron: '0 14 * * *'  # 10:00AM ET every day (UTC-4 during DST / UTC-5 otherwise)
    - cron: '0 20 * * *'  # 4:00PM ET every day (UTC-4 during DST / UTC-5 otherwise)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check builds without sending notifications or updating state'
        required: false
        type: boolean
        default: false
      skip_slack_notifications:
        description: 'Skip Slack notifications (still updates state)'
        required: false
        type: boolean
        default: false

concurrency:
  group: art-acm-217-digest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  monitor:
    name: Monitor ACM 2.17 ART FBC Builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Ensure skopeo is available
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo --version

      - name: Build monitor command
        id: build-cmd
        run: |
          CMD="python tools/art-monitor/monitor.py"
          CMD="$CMD --trains tools/art-monitor/trains.yaml --version 2.17"
          CMD="$CMD --state tools/art-monitor/state"
          CMD="$CMD --log-level DEBUG"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            CMD="$CMD --dry-run"
            echo "Dry-run mode: state will not be written and Slack will not be notified."
          fi
          if [ "${{ inputs.skip_slack_notifications }}" == "true" ]; then
            CMD="$CMD --skip-notifications"
            echo "Silent mode: Slack notifications suppressed."
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Monitor ART builds
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ART_CHANNEL }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
        run: ${{ steps.build-cmd.outputs.cmd }}

      - name: Create Pull Request for state updates
        id: create-pr
        # Only open a PR when state may have changed (not in dry-run mode)
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v8
        with:
          signoff: true
          branch: "auto-update/art-acm-217-digest"
          delete-branch: true
          title: "[Automated] ACM 2.17 ART Build Digest Update"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: |
            Automated update to `tools/art-monitor/state/` after new ACM
            2.17 ART FBC downstream build digests were detected by the scheduled monitor.

            *Generated by the `ART FBC Monitor - ACM 2.17` GitHub Action.*
          labels: |
            lgtm
            approved
            ok-to-test
            automated-pr
          reviewers: dislbenn

      - name: Generate GitHub App token for merge
        id: gen-merge-token
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.WORKFLOW_BOT_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Auto-merge PR
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.gen-merge-token.outputs.token }}
        run: |
          PR_NUM="${{ steps.create-pr.outputs.pull-request-number }}"
          HEAD_SHA="${{ steps.create-pr.outputs.pull-request-head-sha }}"
          echo "Queuing auto-merge for PR #${PR_NUM} at ${HEAD_SHA}"
          # main requires the Prow status checks and the App token cannot
          # bypass them, so queue the merge instead of an immediate merge
          # that would be rejected. The branch is removed on merge by the
          # repository delete_branch_on_merge setting.
          gh pr merge "$PR_NUM" --auto --squash --match-head-commit "$HEAD_SHA"
