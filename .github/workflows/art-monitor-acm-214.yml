name: ART FBC Monitor - ACM 2.14

on:
  schedule:
    # Schedule matches corresponding bundle repo workflow
    - cron: '0 19 * * 1,3,5'   # 3:00PM ET Mon/Wed/Fri (UTC-4 during DST / UTC-5 otherwise)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check builds without sending notifications or updating state'
        required: false
        type: boolean
        default: false
      skip_slack_notifications:
        description: 'Skip Slack notifications (still updates state)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  monitor:
    name: Monitor ACM 2.14 ART FBC Builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Ensure skopeo is available
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo --version

      - name: Build monitor command
        id: build-cmd
        run: |
          CMD="python tools/art-monitor/monitor.py"
          CMD="$CMD --trains tools/art-monitor/trains.yaml --version 2.14"
          CMD="$CMD --state tools/art-monitor/.state.json"
          CMD="$CMD --log-level DEBUG"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            CMD="$CMD --dry-run"
            echo "Dry-run mode: state will not be written and Slack will not be notified."
          fi
          if [ "${{ inputs.skip_slack_notifications }}" == "true" ]; then
            CMD="$CMD --skip-notifications"
            echo "Silent mode: Slack notifications suppressed."
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Monitor ART builds
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ART_CHANNEL }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
        run: ${{ steps.build-cmd.outputs.cmd }}

      - name: Create Pull Request for state updates
        # Only open a PR when state may have changed (not in dry-run mode)
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v8
        with:
          signoff: true
          branch: "auto-update/art-acm-214-digest"
          delete-branch: true
          title: "[Automated] ACM 2.14 ART Build Digest Update"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: |
            Automated update to `tools/art-monitor/.state.json` after new ACM
            2.14 ART FBC downstream build digests were detected by the scheduled monitor.

            *Generated by the `ART FBC Monitor - ACM 2.14` GitHub Action.*
          labels: |
            lgtm
            approved
            ok-to-test
            automated-pr
          reviewers: dislbenn
