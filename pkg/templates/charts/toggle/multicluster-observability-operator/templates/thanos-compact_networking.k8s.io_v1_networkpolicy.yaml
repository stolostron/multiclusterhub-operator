{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thanos-compact
  namespace: '{{ default "open-cluster-management-observability" .Values.global.namespace }}'
spec:
  egress:
  - {}
  ingress:
  - ports:
    - port: 10902
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thanos-compact
  policyTypes:
  - Ingress
  - Egress
{{- end }}
