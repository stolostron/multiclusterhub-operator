{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-observability-addon
  namespace: '{{ default "open-cluster-management-observability" .Values.global.namespace }}'
spec:
  egress:
  - {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/part-of: openshift-monitoring
    ports:
    - port: 8444
      protocol: TCP
  podSelector:
    matchLabels:
      app: multicluster-observability-addon-manager
  policyTypes:
  - Ingress
  - Egress
{{- end }}
