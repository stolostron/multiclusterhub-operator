{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thanos-receive-controller
  namespace: '{{ default "open-cluster-management-observability" .Values.global.namespace }}'
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/part-of: openshift-monitoring
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: observability
      app.kubernetes.io/name: thanos-receive-controller
  policyTypes:
  - Ingress
{{- end }}
