{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thanos-store
  namespace: '{{ default "open-cluster-management-observability" .Values.global.namespace }}'
spec:
  egress:
  - {}
  ingress:
  - ports:
    - port: 10902
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: observability
          app.kubernetes.io/name: thanos-query
          app.kubernetes.io/part-of: observatorium
    ports:
    - port: 10901
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: object-store-gateway
      app.kubernetes.io/instance: observability
      app.kubernetes.io/name: thanos-store
      app.kubernetes.io/part-of: observatorium
  policyTypes:
  - Ingress
  - Egress
{{- end }}
