apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: submariner-addon-webhook-cert
  name: submariner-addon-webhook
  namespace: '{{ default "open-cluster-management" .Values.global.namespace }}'
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: submariner-addon
