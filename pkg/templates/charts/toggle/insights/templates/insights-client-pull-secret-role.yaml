apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.org }}:{{ .Chart.Name }}:insights-client
  namespace: openshift-config
  labels:
    app: insights
    chart: {{.Chart.Name}}-{{.Chart.Version}}
    component: insights-client
    release: {{ .Chart.Name }}
    heritage: release-service
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - pull-secret
  verbs:
  - get
