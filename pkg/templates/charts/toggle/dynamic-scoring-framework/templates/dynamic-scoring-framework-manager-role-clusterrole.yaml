apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dynamic-scoring-framework
  name: dynamic-scoring-framework-manager-role
rules:
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - managedclusters
  verbs:
  - list
- apiGroups:
  - work.open-cluster-management.io
  resources:
  - manifestworks
  verbs:
  - create
- apiGroups:
  - work.open-cluster-management.io
  resourceNames:
  - dynamic-scoring-config-manifestwork
  resources:
  - manifestworks
  verbs:
  - get
  - update
  - delete
