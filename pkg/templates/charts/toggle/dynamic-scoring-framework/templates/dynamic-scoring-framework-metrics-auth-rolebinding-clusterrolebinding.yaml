apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: dynamic-scoring-framework
  name: dynamic-scoring-framework-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynamic-scoring-framework-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: dynamic-scoring-framework-controller
  namespace: '{{ default "open-cluster-management" .Values.global.namespace }}'
