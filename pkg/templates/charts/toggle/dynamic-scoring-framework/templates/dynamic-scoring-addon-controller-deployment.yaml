apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dynamic-scoring-addon-controller
  name: dynamic-scoring-addon-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-scoring-addon-controller
  template:
    metadata:
      labels:
        app: dynamic-scoring-addon-controller
        ocm-antiaffinity-selector: dynamic-scoring-addon-controller
    spec:
      # ACM addition: prefer spreading addon-controller replicas across zones and nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: ocm-antiaffinity-selector
                  operator: In
                  values:
                  - dynamic-scoring-addon-controller
              topologyKey: topology.kubernetes.io/zone
            weight: 70
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: ocm-antiaffinity-selector
                  operator: In
                  values:
                  - dynamic-scoring-addon-controller
              topologyKey: kubernetes.io/hostname
            weight: 35
      containers:
      - args:
        - /dynamic-scoring-addon
        - controller
        env:
        # ACM addition: set DSF agent defaults here; user-created configs can override them.
        - name: DYNAMIC_SCORING_ADDON_IMAGE
          value: '{{ .Values.global.imageOverrides.dynamic_scoring_addon }}'
        # ACM override: use upstream secret names; MCH pull-secret propagation supplies the first when configured.
        - name: DYNAMIC_SCORING_ADDON_IMAGE_PULL_SECRETS
          value: '["open-cluster-management-image-pull-credentials","hub-registry-secret"]'
        - name: DYNAMIC_SCORING_ADDON_NAMESPACE
          value: dynamic-scoring
{{- if .Values.hubconfig.proxyConfigs }}
        # ACM addition: support proxy-configured hub clusters.
        - name: HTTP_PROXY
          value: {{ .Values.hubconfig.proxyConfigs.HTTP_PROXY }}
        - name: HTTPS_PROXY
          value: {{ .Values.hubconfig.proxyConfigs.HTTPS_PROXY }}
        - name: NO_PROXY
          value: {{ .Values.hubconfig.proxyConfigs.NO_PROXY }}
{{- end }}
        # ACM override: use the MCH related-image override and global pull policy.
        image: '{{ .Values.global.imageOverrides.dynamic_scoring_addon }}'
        imagePullPolicy: '{{ .Values.global.pullPolicy }}'
        name: dynamic-scoring-addon-controller
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        # ACM addition: writable temporary storage for the addon controller.
        - mountPath: /tmp
          name: tmp
      # ACM addition: explicitly disable host namespace sharing.
      hostIPC: false
      hostNetwork: false
      hostPID: false
{{- if .Values.global.pullSecret }}
      # ACM addition: allow pulling images with the MCH pull secret.
      imagePullSecrets:
      - name: {{ .Values.global.pullSecret }}
{{- end }}
{{- with .Values.hubconfig.nodeSelector }}
      # ACM addition: honor MCH node-selector configuration.
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
{{- if semverCompare ">=4.11.0" .Values.hubconfig.ocpVersion }}
        # ACM override: gate seccompProfile by OCP version to match other MCH charts.
        seccompProfile:
          type: RuntimeDefault
{{- end }}
      serviceAccountName: dynamic-scoring-addon-sa
{{- with .Values.hubconfig.tolerations }}
      # ACM addition: honor MCH toleration configuration.
      tolerations:
      {{- range . }}
      - {{ if .Key }} key: {{ .Key }} {{- end }}
        {{ if .Operator }} operator: {{ .Operator }} {{- end }}
        {{ if .Value }} value: {{ .Value }} {{- end }}
        {{ if .Effect }} effect: {{ .Effect }} {{- end }}
        {{ if .TolerationSeconds }} tolerationSeconds: {{ .TolerationSeconds }} {{- end }}
        {{- end }}
{{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
