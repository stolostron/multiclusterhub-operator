# ACM override: MCH injects these values from its renderer instead of upstream hubSetting/spokeSetting values.
# The renderer also assigns namespaces to namespaced resources unless a template explicitly sets one.
global:
  apiUrl: ''
  baseDomain: ''
  imageOverrides:
    dynamic_scoring_addon: ''
    dynamic_scoring_controller: ''
  namespace: default
  networkPolicies:
    enabled: true
  olmVersion: v0
  pullSecret: null
  templateOverrides: {}
hubconfig:
  clusterSTSEnabled: false
  nodeSelector: null
  ocpVersion: 4.12.0
  probeConfig: null
  proxyConfigs: null
  replicaCount: 1
  tolerations: []
org: open-cluster-management
