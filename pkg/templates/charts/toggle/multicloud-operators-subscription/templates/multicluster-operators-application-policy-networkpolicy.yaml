{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-application-policy
  namespace: '{{ .Values.global.namespace }}'
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 5353
      protocol: UDP
    - port: 5353
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  ingress:
  - ports:
    - port: 8383
      protocol: TCP
    - port: 8388
      protocol: TCP
    - port: 8386
      protocol: TCP
  - ports:
    - port: 9442
      protocol: TCP
  podSelector:
    matchLabels:
      app: multicluster-operators-application
  policyTypes:
  - Ingress
  - Egress
{{- end }}
