apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: kubevirt-hyperconverged
spec:
  addonName: kubevirt-hyperconverged
  agentSpec:
    deleteOption:
      propagationPolicy: SelectivelyOrphan
      selectivelyOrphans:
        orphaningRules:
        - group: hco.kubevirt.io
          name: kubevirt-hyperconverged
          namespace: openshift-cnv
          resource: hyperconvergeds
    manifestConfigs:
    - resourceIdentifier:
        group: policy.open-cluster-management.io
        name: kubevirt-hyperconverged-operator
        namespace: open-cluster-management-policies
        resource: operatorpolicies
      updateStrategy:
        type: CreateOnly
    - resourceIdentifier:
        group: policy.open-cluster-management.io
        name: kubevirt-hyperconverged-config
        namespace: open-cluster-management-policies
        resource: configurationpolicies
      updateStrategy:
        type: CreateOnly
    workload:
      manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: operatorpolicy-manager
          namespace: open-cluster-management-policies
        rules:
        - apiGroups:
          - policy.open-cluster-management.io
          resources:
          - operatorpolicies
          - configurationpolicies
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: operatorpolicy-manager-hosted-binding
          namespace: open-cluster-management-policies
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: operatorpolicy-manager
        subjects:
        - kind: ServiceAccount
          name: klusterlet-{{ `{{CLUSTER_NAME}}` }}-work-sa
          namespace: open-cluster-management-{{ `{{CLUSTER_NAME}}` }}
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: operatorpolicy-manager-binding
          namespace: open-cluster-management-policies
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: operatorpolicy-manager
        subjects:
        - kind: ServiceAccount
          name: klusterlet-work-sa
          namespace: open-cluster-management-agent
      - apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: kubevirt-hyperconverged-operator
          namespace: open-cluster-management-policies
        spec:
          complianceType: musthave
          operatorGroup:
            name: openshift-cnv
            namespace: openshift-cnv
            targetNamespaces:
            - openshift-cnv
          remediationAction: enforce
          subscription:
            channel: stable
            name: kubevirt-hyperconverged
            namespace: openshift-cnv
          upgradeApproval: Automatic
      - apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kubevirt-hyperconverged-config
          namespace: open-cluster-management-policies
        spec:
          evaluationInterval:
            compliant: 1m
          object-templates-raw: |
            {{ `{{HCO_TEMPLATE_START}}` }} $operator := lookup "policy.open-cluster-management.io/v1beta1" "OperatorPolicy" "open-cluster-management-policies" "kubevirt-hyperconverged-operator" }}
            {{ `{{HCO_TEMPLATE_START}}` }} $operatorReady := false }}
            {{ `{{HCO_TEMPLATE_START}}` }} with $operator }}
            {{ `{{HCO_TEMPLATE_START}}` }} if eq .status.compliant "Compliant" }}
            {{ `{{HCO_TEMPLATE_START}}` }} $operatorReady = true }}
            {{ `{{HCO_TEMPLATE_START}}` }} end }}
            {{ `{{HCO_TEMPLATE_START}}` }} end }}
            {{ `{{HCO_TEMPLATE_START}}` }} if $operatorReady }}
            {{ `{{HCO_TEMPLATE_START}}` }} $existingHCO := lookup "hco.kubevirt.io/v1beta1" "HyperConverged" "openshift-cnv" "kubevirt-hyperconverged" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: hco.kubevirt.io/v1beta1
                kind: HyperConverged
                metadata:
                  name: kubevirt-hyperconverged
                  namespace: openshift-cnv
            {{ `{{HCO_TEMPLATE_START}}` }} if not $existingHCO }}
                  annotations:
                    deployOVS: "false"
                spec:
                  virtualMachineOptions:
                    disableFreePageReporting: false
                    disableSerialConsoleLog: true
                  higherWorkloadDensity:
                    memoryOvercommitPercentage: 100
                  liveMigrationConfig:
                    allowAutoConverge: false
                    allowPostCopy: false
                    completionTimeoutPerGiB: 800
                    parallelMigrationsPerCluster: 5
                    parallelOutboundMigrationsPerNode: 2
                    progressTimeout: 150
                  certConfig:
                    ca:
                      duration: 48h0m0s
                      renewBefore: 24h0m0s
                    server:
                      duration: 24h0m0s
                      renewBefore: 12h0m0s
                  applicationAwareConfig:
                    allowApplicationAwareClusterResourceQuota: false
                    vmiCalcConfigName: DedicatedVirtualResources
                  featureGates:
                    decentralizedLiveMigration: true
                    deployTektonTaskResources: false
                    enableCommonBootImageImport: true
                    withHostPassthroughCPU: false
                    downwardMetrics: false
                    disableMDevConfiguration: false
                    enableApplicationAwareQuota: false
                    deployKubeSecondaryDNS: false
                    nonRoot: true
                    alignCPUs: false
                    enableManagedTenantQuota: false
                    primaryUserDefinedNetworkBinding: false
                    deployVmConsoleProxy: false
                    persistentReservation: false
                    autoResourceLimits: false
                    deployKubevirtIpamController: false
                  workloadUpdateStrategy:
                    batchEvictionInterval: 1m0s
                    batchEvictionSize: 10
                    workloadUpdateMethods:
                      - LiveMigrate
                  uninstallStrategy: BlockUninstallIfWorkloadsExist
                  resourceRequirements:
                    vmiCPUAllocationRatio: 10
            {{ `{{HCO_TEMPLATE_START}}` }} end }}
            {{ `{{HCO_TEMPLATE_START}}` }} else }}
            []
            {{ `{{HCO_TEMPLATE_START}}` }} end }}
          pruneObjectBehavior: None
          remediationAction: enforce
          severity: low
