apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: kubevirt-hyperconverged
spec:
  addonName: kubevirt-hyperconverged
  agentSpec:
    manifestConfigs:
    - resourceIdentifier:
        group: policy.open-cluster-management.io
        name: kubevirt-hyperconverged-operator
        namespace: open-cluster-management-policies
        resource: operatorpolicies
      updateStrategy:
        type: CreateOnly
    # Retain a read-only reference so the Work does not create or change the
    # CR. An existing AppliedManifestWork owner reference needs a separate
    # migration before the Work can be safely removed.
    - resourceIdentifier:
        group: hco.kubevirt.io
        name: kubevirt-hyperconverged
        namespace: openshift-cnv
        resource: hyperconvergeds
      updateStrategy:
        type: ReadOnly
    workload:
      manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: operatorpolicy-manager
          namespace: open-cluster-management-policies
        rules:
        - apiGroups:
          - policy.open-cluster-management.io
          resources:
          - operatorpolicies
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: operatorpolicy-manager-hosted-binding
          namespace: open-cluster-management-policies
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: operatorpolicy-manager
        subjects:
        - kind: ServiceAccount
          name: klusterlet-{{ `{{CLUSTER_NAME}}` }}-work-sa
          namespace: open-cluster-management-{{ `{{CLUSTER_NAME}}` }}
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: operatorpolicy-manager-binding
          namespace: open-cluster-management-policies
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: operatorpolicy-manager
        subjects:
        - kind: ServiceAccount
          name: klusterlet-work-sa
          namespace: open-cluster-management-agent
      - apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: kubevirt-hyperconverged-operator
          namespace: open-cluster-management-policies
        spec:
          complianceType: musthave
          operatorGroup:
            name: openshift-cnv
            namespace: openshift-cnv
            targetNamespaces:
            - openshift-cnv
          remediationAction: enforce
          subscription:
            channel: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.channel }}'
            name: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.name }}'
            namespace: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.namespace }}'
            source: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.source }}'
            sourceNamespace: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.sourceNamespace }}'
            startingCSV: '{{ .Values.global.kubevirtHyperconvergedOperator.subscription.startingCSV }}'
          upgradeApproval: '{{ .Values.global.kubevirtHyperconvergedOperator.upgradeApproval }}'
      # Customers can edit this inform-only policy in the AddOnTemplate to
      # set the desired CR for a fresh install. The hub Policy reads it only
      # after the operator and webhook are ready. It never enforces the CR.
      - apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kubevirt-hyperconverged-config
          namespace: open-cluster-management-policies
        spec:
          remediationAction: inform
          severity: low
          object-templates:
          - complianceType: musthave
            objectDefinition:
              apiVersion: hco.kubevirt.io/v1
              kind: HyperConverged
              metadata:
                name: kubevirt-hyperconverged
                namespace: openshift-cnv
                annotations:
                  deployOVS: "false"
              spec:
                virtualization:
                  virtualMachineOptions:
                    disableFreePageReporting: false
                    disableSerialConsoleLog: true
                  higherWorkloadDensity:
                    memoryOvercommitPercentage: 100
                  liveMigrationConfig:
                    allowAutoConverge: false
                    allowPostCopy: false
                    completionTimeoutPerGiB: 800
                    parallelMigrationsPerCluster: 5
                    parallelOutboundMigrationsPerNode: 2
                    progressTimeout: 150
                  workloadUpdateStrategy:
                    batchEvictionInterval: 1m0s
                    batchEvictionSize: 10
                    workloadUpdateMethods:
                    - LiveMigrate
                  vmiCPUAllocationRatio: 10
                security:
                  certConfig:
                    ca:
                      duration: 48h0m0s
                      renewBefore: 24h0m0s
                    server:
                      duration: 24h0m0s
                      renewBefore: 12h0m0s
                deployment:
                  applicationAwareConfig:
                    allowApplicationAwareClusterResourceQuota: false
                    enable: false
                    vmiCalcConfigName: DedicatedVirtualResources
                  deployVmConsoleProxy: false
                  uninstallStrategy: BlockUninstallIfWorkloadsExist
                workloadSources:
                  enableCommonBootImageImport: true
                featureGates:
                - name: decentralizedLiveMigration
                  state: Enabled
                - name: downwardMetrics
                  state: Disabled
                - name: disableMDevConfiguration
                  state: Disabled
                - name: deployKubeSecondaryDNS
                  state: Disabled
                - name: alignCPUs
                  state: Disabled
                - name: persistentReservation
                  state: Disabled
      # The dependent hub Policy creates a missing CR after the operator and
      # webhook are ready. ReadOnly leaves any existing CR unchanged.
      - apiVersion: hco.kubevirt.io/v1
        kind: HyperConverged
        metadata:
          name: kubevirt-hyperconverged
          namespace: openshift-cnv
    deleteOption:
      propagationPolicy: SelectivelyOrphan
      selectivelyOrphans:
        orphaningRules:
          - group: hco.kubevirt.io
            resource: hyperconvergeds
            namespace: openshift-cnv
            name: kubevirt-hyperconverged
  registration:
  - customSigner:
      signerName: open-cluster-management.io/kubevirt-hyperconverged-addon
      signingCA:
        name: kubevirt-hyperconverged-ca
        namespace: openshift-cnv
    type: CustomSigner
