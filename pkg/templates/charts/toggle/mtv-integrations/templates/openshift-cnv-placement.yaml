apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: openshift-cnv
  namespace: '{{ default "open-cluster-management" .Values.global.namespace }}'
spec:
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - key: acm/cnv-operator-install
          operator: In
          values:
          - 'true'
        - key: acm/cnv-operator-manual-install
          operator: NotIn
          values:
          - 'true'
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          local-cluster: 'true'
