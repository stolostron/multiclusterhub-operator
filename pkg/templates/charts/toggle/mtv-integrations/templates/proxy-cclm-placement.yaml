apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: proxy-cclm
  namespace: '{{ default "open-cluster-management" .Values.global.namespace }}'
spec:
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - key: acm/proxy-cclm
          operator: In
          values:
          - 'true'
