apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: internalhubcomponents.operator.open-cluster-management.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: operator.open-cluster-management.io
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                managedResources:
                  description: >-
                    ManagedResources tracks the resources currently rendered and applied for this
                    component. It is refreshed on every reconcile and used to detect resources
                    that were deployed by a previous version of the component's chart but are no
                    longer part of its rendered templates, so they can be safely cleaned up during
                    upgrades.
                  type: array
                  items:
                    type: object
                    required:
                      - apiVersion
                      - kind
                      - name
                    properties:
                      apiVersion:
                        description: APIVersion of the resource (e.g. "monitoring.coreos.com/v1").
                        type: string
                      kind:
                        description: Kind of the resource (e.g. "ServiceMonitor").
                        type: string
                      name:
                        description: Name of the resource.
                        type: string
                      namespace:
                        description: Namespace of the resource. Empty for cluster-scoped resources.
                        type: string
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: internalhubcomponents
    # singular name to be used as an alias on the CLI and for display
    singular: internalhubcomponent
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: InternalHubComponent
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - ihc